[package]
name = "aceflow_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "aceflow_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
ndarray = { version = "0.15", features = ["serde"] }

# Add these dependencies for weight initialization
rand = "0.8"
ndarray-rand = "0.14"