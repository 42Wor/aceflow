[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "aceflow"
version = "0.2.0"
description = "Monolithic deep learning framework with native SIMD, WebGPU, DSP, and tokenization"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Maaz waheed", email = "wwork4287@gmail.com" }]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
features = ["extension-module"]
manifest-path = "aceflow-core/Cargo.toml"
module-name = "aceflow._native"
python-packages = ["aceflow"]
