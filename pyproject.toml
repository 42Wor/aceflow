[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceflow"
version = "1.0.0"
description = "A pure NumPy implementation of Seq2Seq models with attention mechanism"
authors = [
    {name = "AceFlow Team", email = "team@aceflow.ai"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["seq2seq", "numpy", "machine-learning", "nlp", "attention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.21.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/42Wor/aceflow"
Documentation = "https://github.com/42Wor/aceflow"
Repository = "https://github.com/42Wor/aceflow"
"Issue Tracker" = "https://github.com/42Wor/aceflow/issues"

[project.scripts]
aceflow-train = "aceflow.cli:train"
aceflow-predict = "aceflow.cli:predict"

[tool.setuptools.packages.find]
where = ["."]
include = ["aceflow*"]

[tool.setuptools.package-data]
"aceflow_seq2seq" = ["*.md", "*.txt"]